<text x="522" y="406" font-size="20" fill="#92400e" font-weight="700">DECODE ONCE, THEN SPLIT</text>
<text x="522" y="437" font-size="15" fill="#4b5563">decoded-size check after decode  |  head + fragment split</text>
<text x="522" y="462" font-size="15" fill="#4b5563">one shared budget: never reset, never refunded</text>
