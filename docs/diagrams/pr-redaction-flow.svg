<text x="102" y="1037" font-size="15" fill="#4b5563">HAR: foo=bar?x=1#token=S (plaintext credential)</text>
<text x="102" y="1062" font-size="15" fill="#4b5563">500 layers: ~4.6 s / 324 MB  →  OOM at ~2000</text>
<rect x="820" y="970" width="700" height="150" rx="12" fill="#f0fdf4" stroke="#86efac" stroke-width="2"/>
<text x="842" y="1006" font-size="20" fill="#15803d" font-weight="700">AFTER — bounded and verified</text>
<text x="842" y="1037" font-size="15" fill="#4b5563">HAR: foo=bar?x=1#token=«redacted»</text>
<text x="842" y="1062" font-size="15" fill="#4b5563">500 layers: 9 ms, no secret in output</text>
<text x="80" y="1157" font-size="15" fill="#4b5563">Evidence: 394 unit tests  |  126 targeted tests  |  32 E2E  |  compile + compile:e2e clean  |  4 independent review rounds</text>
