<text x="632" y="206" font-size="20" fill="#1d4ed8" font-weight="700">CDP capture</text>
<text x="632" y="237" font-size="15" fill="#4b5563">network.ts:209</text>
<text x="632" y="262" font-size="15" fill="#4b5563">request.url stored raw</text>
<rect x="1140" y="170" width="380" height="120" rx="12" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/>
