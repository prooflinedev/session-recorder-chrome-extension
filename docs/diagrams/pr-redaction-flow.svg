<text x="152" y="672" font-size="15" fill="#4b5563">foo=bar?x=1#token=«redacted»</text>
<rect x="870" y="580" width="600" height="140" rx="12" fill="#fef2f2" stroke="#fca5a5" stroke-width="2"/>
